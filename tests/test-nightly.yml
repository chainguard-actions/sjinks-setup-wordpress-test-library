name: Test nightly WordPress version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install SVN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y subversion

      - name: Create target directory
        run: mkdir -p /tmp/wp-test-nightly

      - id: action
        uses: .
        with:
          version: 'nightly'
          dir: '/tmp/wp-test-nightly'

      - name: Assert wp_version output is 'nightly'
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ "$WP_VERSION" != "nightly" ]; then
            echo "FAIL: expected wp_version 'nightly' but got '$WP_VERSION'"
            exit 1
          fi
          echo "PASS: wp_version is nightly"

      - name: Assert WordPress directory exists
        run: |
          WP_DIR="/tmp/wp-test-nightly/wordpress"
          if [ ! -d "$WP_DIR" ]; then
            echo "FAIL: WordPress directory not found at $WP_DIR"
            exit 1
          fi
          echo "PASS: WordPress directory exists"

      - name: Assert WordPress test library directory exists
        run: |
          WPTL_DIR="/tmp/wp-test-nightly/wordpress-tests-lib"
          if [ ! -d "$WPTL_DIR" ]; then
            echo "FAIL: WordPress test library directory not found at $WPTL_DIR"
            exit 1
          fi
          echo "PASS: WordPress test library directory exists"
