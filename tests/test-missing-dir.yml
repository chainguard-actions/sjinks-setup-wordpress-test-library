name: Test error on nonexistent directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure directory does not exist
        run: rm -rf /tmp/does-not-exist-wptl
      - id: action
        uses: .
        continue-on-error: true
        with:
          dir: /tmp/does-not-exist-wptl
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WPV: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wp_version: $WPV"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent dir"
            exit 1
          fi
          if [ -n "$WPV" ]; then
            echo "FAIL: wp_version should not be set"
            exit 1
          fi
          if [ -e /tmp/does-not-exist-wptl ]; then
            echo "FAIL: directory should not have been created"
            exit 1
          fi
          echo "PASS"
