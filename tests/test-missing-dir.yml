name: Test error when target dir does not exist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure dir is absent
        run: rm -rf /tmp/wp-does-not-exist-xyz
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '6.4.3'
          dir: /tmp/wp-does-not-exist-xyz
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VER: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wp_version: $VER"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent dir"
            exit 1
          fi
          if [ -n "$VER" ]; then
            echo "FAIL: wp_version should not be set when dir check fails"
            exit 1
          fi
          if [ -n "$WP_TESTS_DIR" ]; then
            echo "FAIL: WP_TESTS_DIR should not be exported"
            exit 1
          fi
          echo "PASS"
