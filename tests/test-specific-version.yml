name: Test specific WordPress version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create install directory
        run: mkdir -p /tmp/wp-test-specific

      - id: action
        uses: .
        with:
          version: '6.4.3'
          dir: '/tmp/wp-test-specific'
          db_user: 'testuser'
          db_password: 'testpass'
          db_name: 'testdb'
          db_host: '127.0.0.1'

      - name: Assert wp_version output matches requested version
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ "$WP_VERSION" != "6.4.3" ]; then
            echo "FAIL: expected wp_version '6.4.3' but got '$WP_VERSION'"
            exit 1
          fi
          echo "PASS: wp_version is '6.4.3'"

      - name: Assert WordPress directory exists
        run: |
          if [ ! -d "/tmp/wp-test-specific/wordpress" ]; then
            echo "FAIL: WordPress directory not found at /tmp/wp-test-specific/wordpress"
            exit 1
          fi
          echo "PASS: WordPress directory exists"

      - name: Assert WordPress test library directory exists
        run: |
          if [ ! -d "/tmp/wp-test-specific/wordpress-tests-lib" ]; then
            echo "FAIL: WordPress test library directory not found"
            exit 1
          fi
          echo "PASS: WordPress test library directory exists"

      - name: Assert wp-tests-config.php contains correct db settings
        run: |
          CONFIG="/tmp/wp-test-specific/wordpress-tests-lib/wp-tests-config.php"
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: wp-tests-config.php not found"
            exit 1
          fi
          if ! grep -q "testuser" "$CONFIG"; then
            echo "FAIL: db_user 'testuser' not found in wp-tests-config.php"
            exit 1
          fi
          if ! grep -q "testdb" "$CONFIG"; then
            echo "FAIL: db_name 'testdb' not found in wp-tests-config.php"
            exit 1
          fi
          echo "PASS: wp-tests-config.php contains correct db settings"
