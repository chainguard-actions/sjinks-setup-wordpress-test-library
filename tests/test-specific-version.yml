name: Test specific WordPress version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create target directory
        run: mkdir -p /tmp/wp-test-version
      - id: action
        uses: .
        with:
          version: '6.4.3'
          db_user: wordpress
          db_password: wordpress
          db_name: wordpress_test
          db_host: 127.0.0.1
          dir: /tmp/wp-test-version
      - name: Assert wp_version output matches requested version
        env:
          ACTUAL: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "actual wp_version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "6.4.3" ]; then
            echo "FAIL: expected wp_version '6.4.3', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: wp_version=$ACTUAL"
      - name: Assert WordPress test library files exist
        run: |
          if [ ! -d "/tmp/wp-test-version/wordpress-tests-lib" ]; then
            echo "FAIL: WordPress test library directory not found"
            exit 1
          fi
          echo "PASS: WordPress test library directory exists"
      - name: Assert WordPress directory exists
        run: |
          if [ ! -d "/tmp/wp-test-version/wordpress" ]; then
            echo "FAIL: WordPress directory not found at /tmp/wp-test-version/wordpress"
            exit 1
          fi
          echo "PASS: WordPress directory exists"
