name: Test custom cache prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mydb_test
          MYSQL_USER: myuser
          MYSQL_PASSWORD: mypassword
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install SVN
        run: sudo apt-get install -y subversion
      - name: Create target directory
        run: mkdir -p /tmp/wp-cache-test
      - id: action
        uses: .
        with:
          version: 'latest'
          cache_prefix: 'my-custom-prefix'
          dir: '/tmp/wp-cache-test'
          db_user: 'myuser'
          db_password: 'mypassword'
          db_name: 'mydb_test'
          db_host: '127.0.0.1'
      - name: Assert wp_version output is set
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          echo "PASS: wp_version=$WP_VERSION"
      - name: Assert WordPress files are present at custom dir
        run: |
          if [ ! -d "/tmp/wp-cache-test/wordpress" ]; then
            echo "FAIL: WordPress directory not found at /tmp/wp-cache-test/wordpress"
            exit 1
          fi
          echo "PASS: WordPress directory exists"
