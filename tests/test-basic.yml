name: Test basic usage (latest WordPress)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create target directory
        run: mkdir -p /tmp/wp-test-basic

      - id: action
        uses: .
        with:
          version: 'latest'
          dir: '/tmp/wp-test-basic'

      - name: Assert wp_version output is set
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          # Should look like a version number (e.g. 6.4.2)
          if ! echo "$WP_VERSION" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "FAIL: wp_version '$WP_VERSION' does not look like a version number"
            exit 1
          fi
          echo "PASS: wp_version=$WP_VERSION"

      - name: Assert WordPress directory exists
        run: |
          if [ ! -d "/tmp/wp-test-basic/wordpress" ]; then
            echo "FAIL: WordPress directory not found at /tmp/wp-test-basic/wordpress"
            exit 1
          fi
          echo "PASS: WordPress directory exists"

      - name: Assert WordPress test library directory exists
        run: |
          if [ ! -d "/tmp/wp-test-basic/wordpress-tests-lib" ]; then
            echo "FAIL: WordPress test library directory not found at /tmp/wp-test-basic/wordpress-tests-lib"
            exit 1
          fi
          echo "PASS: WordPress test library directory exists"

      - name: Assert wp-tests-config.php was generated
        run: |
          if [ ! -f "/tmp/wp-test-basic/wordpress-tests-lib/wp-tests-config.php" ]; then
            echo "FAIL: wp-tests-config.php not found"
            exit 1
          fi
          echo "PASS: wp-tests-config.php exists"

      - name: Assert WP_TESTS_DIR env var is exported
        run: |
          echo "WP_TESTS_DIR: $WP_TESTS_DIR"
          if [ -z "$WP_TESTS_DIR" ]; then
            echo "FAIL: WP_TESTS_DIR env var is not set"
            exit 1
          fi
          echo "PASS: WP_TESTS_DIR=$WP_TESTS_DIR"
