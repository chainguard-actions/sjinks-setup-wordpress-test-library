name: Test branch-style WordPress version (6.4.x)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create install directory
        run: mkdir -p /tmp/wp-test-branch

      - id: action
        uses: .
        with:
          version: '6.4.x'
          dir: '/tmp/wp-test-branch'
          db_user: 'wordpress'
          db_password: 'wordpress'
          db_name: 'wordpress_test'
          db_host: '127.0.0.1'

      - name: Assert wp_version output starts with 6.4
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          if ! echo "$WP_VERSION" | grep -qE '^6\.4'; then
            echo "FAIL: expected wp_version to start with '6.4' but got '$WP_VERSION'"
            exit 1
          fi
          echo "PASS: wp_version '$WP_VERSION' starts with 6.4"

      - name: Assert WordPress directory exists
        run: |
          if [ ! -d "/tmp/wp-test-branch/wordpress" ]; then
            echo "FAIL: WordPress directory not found at /tmp/wp-test-branch/wordpress"
            exit 1
          fi
          echo "PASS: WordPress directory exists"

      - name: Assert WordPress test library directory exists
        run: |
          if [ ! -d "/tmp/wp-test-branch/wordpress-tests-lib" ]; then
            echo "FAIL: WordPress test library directory not found"
            exit 1
          fi
          echo "PASS: WordPress test library directory exists"

      - name: Assert wp-tests-config.php was created
        run: |
          if [ ! -f "/tmp/wp-test-branch/wordpress-tests-lib/wp-tests-config.php" ]; then
            echo "FAIL: wp-tests-config.php not found"
            exit 1
          fi
          echo "PASS: wp-tests-config.php exists"
