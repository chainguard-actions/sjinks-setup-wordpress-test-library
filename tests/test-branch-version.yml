name: Test branch version format (x.y.x)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y subversion mariadb-server mariadb-client

      - name: Start MariaDB and create database
        run: |
          sudo systemctl start mariadb || sudo service mariadb start || true
          # Wait for MariaDB to be ready
          for i in $(seq 1 30); do
            if sudo mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MariaDB is ready"
              break
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done
          sudo mysql -e "CREATE USER IF NOT EXISTS 'wordpress'@'%' IDENTIFIED BY 'wordpress';"
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS wordpress_test;"
          sudo mysql -e "GRANT ALL PRIVILEGES ON wordpress_test.* TO 'wordpress'@'%';"
          sudo mysql -e "FLUSH PRIVILEGES;"

      - name: Create installation directory
        run: mkdir -p /tmp/wp-test-branch

      - id: action
        uses: .
        with:
          version: '6.5.x'
          dir: '/tmp/wp-test-branch'
          db_user: 'wordpress'
          db_password: 'wordpress'
          db_name: 'wordpress_test'
          db_host: '127.0.0.1'

      - name: Assert wp_version output starts with 6.5
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          if ! echo "$WP_VERSION" | grep -qE '^6\.5'; then
            echo "FAIL: expected wp_version to start with 6.5 but got $WP_VERSION"
            exit 1
          fi
          echo "PASS: wp_version=$WP_VERSION starts with 6.5"

      - name: Assert WordPress Test Library directory exists
        run: |
          if [ ! -d "/tmp/wp-test-branch/wordpress-tests-lib" ]; then
            echo "FAIL: WordPress Test Library directory not found"
            exit 1
          fi
          echo "PASS: WordPress Test Library directory exists"

      - name: Assert WP_TESTS_DIR env var points to correct directory
        run: |
          echo "WP_TESTS_DIR: $WP_TESTS_DIR"
          if [ "$WP_TESTS_DIR" != "/tmp/wp-test-branch/wordpress-tests-lib" ]; then
            echo "FAIL: expected WP_TESTS_DIR=/tmp/wp-test-branch/wordpress-tests-lib but got $WP_TESTS_DIR"
            exit 1
          fi
          echo "PASS: WP_TESTS_DIR is correct"
