name: Test custom directory and cache prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom install directory
        run: mkdir -p /tmp/custom-wp-dir

      - id: action
        uses: .
        with:
          version: '6.4.3'
          dir: '/tmp/custom-wp-dir'
          cache_prefix: 'myproject'
          db_user: 'wpuser'
          db_password: 'wppass'
          db_name: 'wp_custom_db'
          db_host: '127.0.0.1'

      - name: Assert wp_version output is set
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          echo "PASS: wp_version is '$WP_VERSION'"

      - name: Assert WordPress installed in custom directory
        run: |
          if [ ! -d "/tmp/custom-wp-dir/wordpress" ]; then
            echo "FAIL: WordPress not found in custom directory /tmp/custom-wp-dir/wordpress"
            exit 1
          fi
          echo "PASS: WordPress installed in custom directory"

      - name: Assert WordPress test library installed in custom directory
        run: |
          if [ ! -d "/tmp/custom-wp-dir/wordpress-tests-lib" ]; then
            echo "FAIL: WordPress test library not found in custom directory"
            exit 1
          fi
          echo "PASS: WordPress test library installed in custom directory"

      - name: Assert wp-tests-config.php has correct db_name
        run: |
          CONFIG="/tmp/custom-wp-dir/wordpress-tests-lib/wp-tests-config.php"
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: wp-tests-config.php not found"
            exit 1
          fi
          if ! grep -q "wp_custom_db" "$CONFIG"; then
            echo "FAIL: db_name 'wp_custom_db' not found in wp-tests-config.php"
            cat "$CONFIG" | head -20
            exit 1
          fi
          echo "PASS: wp-tests-config.php has correct db_name"

      - name: Assert WP_TESTS_DIR points to custom directory
        env:
          WP_TESTS_DIR: ${{ env.WP_TESTS_DIR }}
        run: |
          echo "WP_TESTS_DIR: $WP_TESTS_DIR"
          if [ -z "$WP_TESTS_DIR" ]; then
            echo "FAIL: WP_TESTS_DIR is not set"
            exit 1
          fi
          if [ "$WP_TESTS_DIR" != "/tmp/custom-wp-dir/wordpress-tests-lib" ]; then
            echo "FAIL: expected WP_TESTS_DIR '/tmp/custom-wp-dir/wordpress-tests-lib' but got '$WP_TESTS_DIR'"
            exit 1
          fi
          echo "PASS: WP_TESTS_DIR points to custom directory"
