name: Test custom directory and database credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: custom_wp_test
          MYSQL_USER: wpuser
          MYSQL_PASSWORD: wppass
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom install directory
        run: mkdir -p /tmp/wp-custom
      - id: action
        uses: .
        with:
          version: 'latest'
          db_user: 'wpuser'
          db_password: 'wppass'
          db_name: 'custom_wp_test'
          db_host: '127.0.0.1'
          dir: '/tmp/wp-custom'
      - name: Assert wp_version output is set
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          echo "PASS: wp_version=$WP_VERSION"
      - name: Assert WordPress installed in custom directory
        run: |
          if [ ! -d "/tmp/wp-custom/wordpress" ]; then
            echo "FAIL: /tmp/wp-custom/wordpress directory not found"
            exit 1
          fi
          echo "PASS: /tmp/wp-custom/wordpress exists"
      - name: Assert WordPress test library installed in custom directory
        run: |
          if [ ! -d "/tmp/wp-custom/wordpress-tests-lib" ]; then
            echo "FAIL: /tmp/wp-custom/wordpress-tests-lib directory not found"
            exit 1
          fi
          echo "PASS: /tmp/wp-custom/wordpress-tests-lib exists"
