name: Test custom database credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: custom_wp_db
          MYSQL_USER: custom_user
          MYSQL_PASSWORD: custom_pass
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=rootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create target directory
        run: mkdir -p /tmp/wp-test-custom-db
      - id: action
        uses: .
        with:
          version: latest
          db_user: custom_user
          db_password: custom_pass
          db_name: custom_wp_db
          db_host: 127.0.0.1
          dir: /tmp/wp-test-custom-db
          cache_prefix: 'myproject'
      - name: Assert wp_version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "actual wp_version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          echo "PASS: wp_version=$ACTUAL"
      - name: Assert WordPress directory exists at custom dir
        run: |
          if [ ! -d "/tmp/wp-test-custom-db/wordpress" ]; then
            echo "FAIL: WordPress directory not found at /tmp/wp-test-custom-db/wordpress"
            exit 1
          fi
          echo "PASS: WordPress directory exists at custom location"
      - name: Assert wp-tests-config.php contains custom credentials
        run: |
          CONFIG_FILE="/tmp/wp-test-custom-db/wordpress-tests-lib/wp-tests-config.php"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: wp-tests-config.php not found at $CONFIG_FILE"
            exit 1
          fi
          if ! grep -q "custom_wp_db" "$CONFIG_FILE"; then
            echo "FAIL: custom_wp_db not found in wp-tests-config.php"
            exit 1
          fi
          if ! grep -q "custom_user" "$CONFIG_FILE"; then
            echo "FAIL: custom_user not found in wp-tests-config.php"
            exit 1
          fi
          echo "PASS: wp-tests-config.php contains custom credentials"
