name: Test custom database credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create target directory
        run: mkdir -p /tmp/wp-test-db

      - id: action
        uses: .
        with:
          version: '6.4.2'
          dir: '/tmp/wp-test-db'
          db_user: 'myuser'
          db_password: 'mypassword'
          db_name: 'mydb'
          db_host: '192.168.1.100'

      - name: Assert wp_version output is set
        env:
          WP_VERSION: ${{ steps.action.outputs.wp_version }}
        run: |
          echo "wp_version: $WP_VERSION"
          if [ -z "$WP_VERSION" ]; then
            echo "FAIL: wp_version output is empty"
            exit 1
          fi
          echo "PASS: wp_version=$WP_VERSION"

      - name: Assert wp-tests-config.php contains custom DB user
        run: |
          CONFIG="/tmp/wp-test-db/wordpress-tests-lib/wp-tests-config.php"
          if [ ! -f "$CONFIG" ]; then
            echo "FAIL: wp-tests-config.php not found"
            exit 1
          fi
          if ! grep -q "myuser" "$CONFIG"; then
            echo "FAIL: wp-tests-config.php does not contain custom db_user 'myuser'"
            cat "$CONFIG"
            exit 1
          fi
          echo "PASS: custom db_user found in config"

      - name: Assert wp-tests-config.php contains custom DB password
        run: |
          CONFIG="/tmp/wp-test-db/wordpress-tests-lib/wp-tests-config.php"
          if ! grep -q "mypassword" "$CONFIG"; then
            echo "FAIL: wp-tests-config.php does not contain custom db_password 'mypassword'"
            exit 1
          fi
          echo "PASS: custom db_password found in config"

      - name: Assert wp-tests-config.php contains custom DB name
        run: |
          CONFIG="/tmp/wp-test-db/wordpress-tests-lib/wp-tests-config.php"
          if ! grep -q "mydb" "$CONFIG"; then
            echo "FAIL: wp-tests-config.php does not contain custom db_name 'mydb'"
            exit 1
          fi
          echo "PASS: custom db_name found in config"

      - name: Assert wp-tests-config.php contains custom DB host
        run: |
          CONFIG="/tmp/wp-test-db/wordpress-tests-lib/wp-tests-config.php"
          if ! grep -q "192.168.1.100" "$CONFIG"; then
            echo "FAIL: wp-tests-config.php does not contain custom db_host '192.168.1.100'"
            exit 1
          fi
          echo "PASS: custom db_host found in config"
